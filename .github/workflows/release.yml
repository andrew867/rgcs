name: release

# Tag-triggered release builds: pushing a v* tag creates the GitHub
# release (notes from the annotated tag message) and builds, smoke-
# checks, manifests, and uploads the platform packages automatically:
#   - Windows: portable onedir zip + per-user Inno Setup installer
#   - Linux:   portable onedir tar.gz
#   - macOS:   portable onedir tar.gz
# Every binary passes `--smoke-check` (offscreen) before upload, and
# each package ships with its SHA-256 and a release manifest
# (schemas/release/release_manifest.schema.json). Builds are UNSIGNED
# per project policy.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTES: gh refuses --notes-from-tag combined with --repo, so
        # the checked-out repo provides context. checkout's fetch-tags
        # conflicts with the triggering tag ref on tag events
        # (actions/checkout#1467) and leaves only a lightweight local
        # tag — force-fetch the real annotated tag object so
        # --notes-from-tag reads the tag message.
        run: |
          git fetch origin --no-tags --force \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --verify-tag \
                 --title "RGCS $GITHUB_REF_NAME" --notes-from-tag

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[desktop,packaging]"
      - name: Build portable onedir (rgcs_desktop.spec)
        run: |
          pyinstaller tools/packaging/rgcs_desktop.spec --noconfirm `
            --distpath release/windows --workpath build/pyi-win
      - name: Smoke check portable build
        run: |
          & "release\windows\rgcs-workbench\rgcs-workbench.exe" --smoke-check
          if ($LASTEXITCODE -ne 0) { throw "portable smoke failed" }
      - name: Package portable zip + manifest + sha256
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          python tools/packaging/release_manifest.py `
            --platform windows `
            --build-command ".github/workflows/release.yml (windows)" `
            --smoke-command "rgcs-workbench.exe --smoke-check" `
            --smoke-status passed `
            --artifact release/windows/rgcs-workbench/rgcs-workbench.exe `
            --out release/windows/rgcs-workbench/release_manifest.json
          $zip = "rgcs-workbench-$tag-windows-x64.zip"
          Compress-Archive -Path release\windows\rgcs-workbench `
            -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" `
            | Out-File -Encoding ascii "$zip.sha256"
      - name: Build installer onedir (RGCSWorkbench.spec)
        run: |
          pyinstaller packaging/RGCSWorkbench.spec --noconfirm `
            --workpath build/pyi-inno
      - name: Smoke check installer build
        run: |
          $p = Start-Process -Wait -PassThru -NoNewWindow `
            -FilePath "dist\RGCSWorkbench\RGCSWorkbench.exe" `
            -ArgumentList "--smoke-check"
          if ($p.ExitCode -ne 0) { throw "installer-onedir smoke failed ($($p.ExitCode))" }
      - name: Compile Inno Setup installer (unsigned, per-user)
        run: |
          choco install innosetup -y --no-progress
          $env:RGCS_VERSION = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $env:RGCS_BUILD_ROOT = (Resolve-Path "dist\RGCSWorkbench").Path
          $env:RGCS_OUTPUT_ROOT = (New-Item -ItemType Directory -Force `
            "release\installer").FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging\RGCS_Workbench.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          $setup = Get-ChildItem "release\installer\*.exe" | Select-Object -First 1
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower() `
            + "  " + $setup.Name `
            | Out-File -Encoding ascii ($setup.FullName + ".sha256")
      - name: Upload Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $zip = "rgcs-workbench-$tag-windows-x64.zip"
          $setup = Get-ChildItem "release\installer\*.exe" | Select-Object -First 1
          gh release upload $tag --clobber `
            "$zip#Windows portable build (x64, smoke-checked)" `
            "$zip.sha256#Windows portable SHA-256" `
            "$($setup.FullName)#Windows installer (per-user, unsigned)" `
            "$($setup.FullName).sha256#Windows installer SHA-256"

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install -e ".[desktop,packaging]"
      - name: Build + smoke check (build_linux.sh)
        run: bash tools/packaging/build_linux.sh
      - name: Package tar.gz + manifest + sha256
        run: |
          tag="$GITHUB_REF_NAME"
          python tools/packaging/release_manifest.py \
            --platform linux \
            --build-command ".github/workflows/release.yml (linux)" \
            --smoke-command "rgcs-workbench --smoke-check" \
            --smoke-status passed \
            --artifact release/linux/rgcs-workbench/rgcs-workbench \
            --out release/linux/rgcs-workbench/release_manifest.json
          tarball="rgcs-workbench-$tag-linux-x64.tar.gz"
          tar -C release/linux -czf "$tarball" rgcs-workbench
          sha256sum "$tarball" > "$tarball.sha256"
      - name: Upload Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          tarball="rgcs-workbench-$tag-linux-x64.tar.gz"
          gh release upload "$tag" --clobber \
            "$tarball#Linux portable build (x64, smoke-checked)" \
            "$tarball.sha256#Linux portable SHA-256"

  macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[desktop,packaging]"
      - name: Build portable onedir
        run: |
          pyinstaller tools/packaging/rgcs_desktop.spec --noconfirm \
            --distpath release/macos --workpath build/pyi-mac
      - name: Smoke check
        run: release/macos/rgcs-workbench/rgcs-workbench --smoke-check
      - name: Package tar.gz + manifest + sha256
        run: |
          tag="$GITHUB_REF_NAME"
          arch="$(uname -m)"
          python tools/packaging/release_manifest.py \
            --platform "macos-$arch" \
            --build-command ".github/workflows/release.yml (macos)" \
            --smoke-command "rgcs-workbench --smoke-check" \
            --smoke-status passed \
            --artifact release/macos/rgcs-workbench/rgcs-workbench \
            --out release/macos/rgcs-workbench/release_manifest.json
          tarball="rgcs-workbench-$tag-macos-$arch.tar.gz"
          tar -C release/macos -czf "$tarball" rgcs-workbench
          shasum -a 256 "$tarball" > "$tarball.sha256"
      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          arch="$(uname -m)"
          tarball="rgcs-workbench-$tag-macos-$arch.tar.gz"
          gh release upload "$tag" --clobber \
            "$tarball#macOS portable build ($arch, smoke-checked)" \
            "$tarball.sha256#macOS portable SHA-256"
