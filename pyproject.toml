[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgcs"
version = "8.5.2"
description = "RGCS v4.1 / RSCS 2.0: typed resonant-coordinate framework (rscs_core), the deterministic RGCS crystal-application core (rgcs_core), and the capability-aware v4 multiphysics stack (rscs2_core: anisotropic FEM, piezoelectricity, projections, uncertainty-aware Eye Consensus, reduced-order reference systems, quarantined source hypotheses, proof bundles)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Green", email = "me@andrewgreen.ca" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6", "pyqtgraph>=0.13"]
workbook = ["openpyxl>=3.1"]           # xlsx export (interop only;
#                                        Excel not required to RUN)
fem = ["scikit-fem>=9.0", "meshio>=5.3"]   # custom-specimen FEM path (R10.13)
packaging = ["pyinstaller>=6.0"]       # Windows portable/onedir build
workbench = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]
# R10.61 NASA archive codec workbench. Optional: the wide-envelope codec,
# the text lanes and the route lane run on the base dependencies alone.
# These are needed only for the catalog/download/FITS lanes.
archive = [
    "httpx>=0.27",          # bounded, resumable downloads
    "astropy>=6.0",         # FITS inspection and binary tables
    "unlzw3>=0.2",          # legacy Unix .Z (LZW) -- NOT gzip
    "duckdb>=1.0",          # result ledger
    "pyarrow>=15.0",        # derived tables
]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
    "pytest-qt>=4.2",
    # The full suite exercises the optional archive FITS lanes.
    "astropy>=6.0",
    # MIG-CODE-07: schema validation deps were imported but undeclared
    # (V2-PKG-01 family); experiments/schemas/validate.py needs both.
    "jsonschema>=4.21",
    "referencing>=0.33",
    # R9-D-020: tests/v52/test_r9_packaging.py compares SOURCE_ROOTS
    # against setuptools package discovery. setuptools is a
    # build-system requirement and is NOT present in CI's portable
    # job, so that module failed to collect on every platform while
    # passing locally. Declared here so the guard actually runs.
    "setuptools>=68",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
rgcs-v4 = "rscs2_core.cli:main"
rgcs-workbook = "rgcs_workbench.workbook:main"
rgcs-coordinate = "rgcs_coordinate.cli:main"
rgcs-lab = "rgcs_lab.cli:main"
rgcs-sonic = "rgcs_desktop.services.sonic_cli:main"
rgcs = "r1013.cli:main"

[project.gui-scripts]
rgcs-workbench = "rgcs_desktop.app.main:main"

[tool.setuptools.packages.find]
include = ["r1015a*", "rgcs_surface_wave*", "rgcs_core*", "rgcs_desktop*", "rscs_core*", "rscs2_core*", "cspc*", "pmwr*", "r3*", "r4*",
           "r6*", "r7*", "r8*", "r9*", "r10*", "r11*", "r12*", "r13*", "r15*",
           "cwatlas*", "rgcs_coordinate*", "rgcs_lab*",
           "rgcs_workbench*", "fkey_instrument*", "rgcs_archive*",
           "resonator_platform*", "consciousness_lane*",
           "rgcs_phyrll_v06*", "rgcs_terra_release*", "rgcs_phyrll_v07*",
           "rgcs_ardk*"]

[tool.setuptools.package-data]
rgcs_desktop = ["data/*.json",
                "data/factory_sessions/curated/*.json"]
rscs_core = ["registry/*.yaml"]
rscs2_core = ["registry/*.yaml"]
r15 = ["schemas/*.json"]
cwatlas = ["schemas/*.json", "fixtures/*.json"]
"cwatlas.r1082" = ["schemas/*.json", "fixtures/*.json"]
rgcs_ardk = [
    "params/*.json", "params/*.yaml",
    "pcb/*.csv", "pcb/*.json", "pcb/*.md",
    "drive/*.json", "drive/authority/*", "drive/seed/*",
    "firmware/*.md",
    "bench/*.md", "bench/schemas/*.json",
    "mech/*.md", "mech/*.json", "mech/*.scad",
    "reports/*.md", "reports/*.csv",
]
# RCW P04: the parity guard resolves package-data by the TOP-LEVEL
# source root (right-anchored match), so the fixtures glob must live on
# the top-level key, not only a dotted subpackage key (R10.8.2 lesson).
# Public workbench release cage registries (RC1 cage, 2026-08-04;
# CSV ledger added by the RC2 physics-spine pack, 2026-08-06).
rgcs_workbench = ["public_cage/*.json", "public_cage/*.csv"]
"rgcs_workbench.public_cage" = ["*.json", "*.csv"]
rgcs_coordinate = ["fixtures/*.json"]
"rgcs_coordinate.fixtures" = ["*.json"]
rgcs_lab = ["common/*.json", "data/memory_corpus/*.json"]
"rgcs_lab.common" = ["*.json"]
"rgcs_lab.data" = ["memory_corpus/*.json"]
r1012 = ["data/*.json", "data/*.csv"]
r1015a = ["data/*.json", "data/*.scad"]
r1013 = ["data/schemas/*.json", "data/examples/*.json", "data/examples/*.csv", "data/examples/fixtures/*.json"]
r1011 = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/docs", "tests/release", "tests/property", "tests/golden", "tests/regression", "tests/ui", "tests/integration", "tests/adversarial", "tests/v4", "tests/v49", "tests/v50", "tests/v51", "tests/v52", "tests/v6", "tests/v8", "tests/cwatlas", "tests/rgcs_coordinate", "tests/rgcs_lab", "rgcs_ardk/tests", "tests/release_cage"]
pythonpath = ["."]
markers = [
    "slow: long-running tests (dataset regeneration)",
    "benchmark: non-gating performance checks",
]
